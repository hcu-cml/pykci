[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pykci"
dynamic = ["version"]          # pykci.__version__ (src/pykci/__init__.py)
description = "Python Knowledge Graph for Cities: CityGML <-> Neo4j, OSM fusion, 3D Tiles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "lxml",
    "neo4j>=5.28",
    "pyproj",
    "mapbox-earcut",
    "numpy",
    "shapely",          # OSM footprint matching; 3D Tiles opening cut-outs + footprints
]

[project.optional-dependencies]
llm = [
    "langchain",
    "langchain-community",
    "langchain-ollama",
    "langchain-neo4j",
    "langchain-anthropic",
]
capture = ["playwright"]
test = ["pytest>=8", "ruff>=0.6"]     # ruff: the undefined-name check of the contract tests

[project.urls]
Repository = "https://github.com/hcu-cml/pykci"

[project.scripts]
pykci = "pykci.cli:main"

# The code is the package src/pykci (a library and the `pykci` command). The files at the
# repository root with the old script names (ingest_citygml.py, …) are shims for running
# from a checkout (_pykci_shim.py); they are not installed. eval/ holds research scripts
# that run from a source checkout only, so install editable (`pip install -e .`) to use
# inventory / stats / osm-census.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pykci = ["osmconf.ini"]          # the OSM driver configuration of ingest_osm

[tool.setuptools.dynamic]
version = { attr = "pykci.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# markers and the database fixtures: src/pykci/testing/plugin.py
addopts = "-ra --strict-markers --import-mode=importlib -p pykci.testing.plugin"
