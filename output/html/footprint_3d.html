// ── Coordinate origin ────────────────────────────────────────────────────────
var REF_ID = "DEHHALKA4IB000Cv";
var OX = BUILDINGS[REF_ID].cx;
var OY = BUILDINGS[REF_ID].cy;
var OZ = BUILDINGS[REF_ID].gz;

// CityGML [X, Y, Z] → Three.js [x, y(up), z]
function w2t(p) {
  return [p[0] - OX, p[2] - OZ, -(p[1] - OY)];
}

// ── Polygon triangulation: Newell normal + earcut ────────────────────────────
function newellNormal(pts) {
  var nx = 0, ny = 0, nz = 0;
  for (var i = 0; i < pts.length; i++) {
    var p0 = pts[i], p1 = pts[(i + 1) % pts.length];
    nx += (p0[1] - p1[1]) * (p0[2] + p1[2]);
    ny += (p0[2] - p1[2]) * (p0[0] + p1[0]);
    nz += (p0[0] - p1[0]) * (p0[1] + p1[1]);
  }
  return [nx, ny, nz];
}

function triangulatePoly(ring) {
  var raw = ring.slice(0, -1);   // drop closing duplicate
  if (raw.length < 3) return [];

  var pts = raw.map(w2t);        // convert to Three.js coords

  if (pts.length === 3) {
    return pts[0].concat(pts[1]).concat(pts[2]);
  }

  var n  = newellNormal(pts);
  var ax = Math.abs(n[0]), ay = Math.abs(n[1]), az = Math.abs(n[2]);
  var flat2d;

  if (ay >= ax && ay >= az) {
    // Horizontal surface (roof / ground) → project onto XZ
    flat2d = [];
    for (var i = 0; i < pts.length; i++) flat2d.push(pts[i][0], pts[i][2]);
  } else if (ax >= az) {
    // Wall roughly facing X → project onto ZY
    flat2d = [];
    for (var i = 0; i < pts.length; i++) flat2d.push(pts[i][2], pts[i][1]);
  } else {
    // Wall roughly facing Z → project onto XY
    flat2d = [];
    for (var i = 0; i < pts.length; i++) flat2d.push(pts[i][0], pts[i][1]);
  }

  var indices = earcut(flat2d);
  var verts = [];
  for (var i = 0; i < indices.length; i += 3) {
    verts = verts.concat(pts[indices[i]], pts[indices[i+1]], pts[indices[i+2]]);
  }
  return verts;
}

// ── Renderer ─────────────────────────────────────────────────────────────────
var canvas = document.getElementById('c');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ── Scene / Camera / Controls ─────────────────────────────────────────────────

scene.background = new THREE.Color(0x6a9ec7);
scene.fog = new THREE.FogExp2(0x7ab0d0, 0.0016);

var camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.5, 2000);
camera.position.set(160, 110, 200);

var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(20, 30, -20);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 15;
controls.maxDistance = 600;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.update();

// ── Lights ────────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xd0e8ff, 0.55));

var sun = new THREE.DirectionalLight(0xfff5e0, 1.3);
sun.position.set(200, 350, 120);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 900;
sun.shadow.camera.left   = sun.shadow.camera.bottom = -250;
sun.shadow.camera.right  = sun.shadow.camera.top    =  250;
scene.add(sun);

scene.add(new THREE.HemisphereLight(0x87ceeb, 0x5a8040, 0.45));

// ── Ground plane ──────────────────────────────────────────────────────────────
var ground = new THREE.Mesh(
  new THREE.PlaneGeometry(700, 700),
  new THREE.MeshLambertMaterial({ color: 0x5a8a50 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.15;
ground.receiveShadow = true;
scene.add(ground);

scene.add(new THREE.GridHelper(500, 50, 0x334433, 0x2a3a2a));

// ── 100 m radius circle ───────────────────────────────────────────────────────
(function () {
  var N = 256;
  var pts = [];
  for (var i = 0; i <= N; i++) {
    var a = (i / N) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a) * 100, 0.4, Math.sin(a) * 100));
  }
  var geo = new THREE.BufferGeometry().setFromPoints(pts);
  var mat = new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 7, gapSize: 4 });
  var line = new THREE.Line(geo, mat);
  line.computeLineDistances();
  scene.add(line);

  // Small pole at origin
  scene.add(new THREE.Mesh(
    new THREE.CylinderGeometry(0.4, 0.4, 2, 8),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  ));
})();

// ── Building meshes ───────────────────────────────────────────────────────────
var STYLE = {
  reference: {
    WallSurface:   0x558b2f,
    RoofSurface:   0x8bc34a,
    GroundSurface: 0x33691e
  },
  neighbour: {
    WallSurface:   0xc62828,
    RoofSurface:   0xef9a9a,
    GroundSurface: 0x7f0000
  }
};

var hoverTargets = [];

Object.keys(BUILDINGS).forEach(function (id) {
  var bdata = BUILDINGS[id];
  var styleMap = STYLE[bdata.role];

  Object.keys(bdata.surfaces).forEach(function (stype) {
    var polys = bdata.surfaces[stype];
    var color = styleMap[stype] !== undefined ? styleMap[stype] : 0xaaaaaa;
    var mat = new THREE.MeshLambertMaterial({ color: color, side: THREE.DoubleSide });

    polys.forEach(function (ring) {
      var verts = triangulatePoly(ring);
      if (!verts.length) return;

      var geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      geo.computeVertexNormals();

      var mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow  = (stype !== 'GroundSurface');
      mesh.receiveShadow = true;
      mesh.userData = { id: id, stype: stype, bdata: bdata };
      scene.add(mesh);
      if (stype !== 'GroundSurface') hoverTargets.push(mesh);
    });

    // Edge outlines for wall and roof
    if (stype !== 'GroundSurface') {
      polys.forEach(function (ring) {
        var edgePts = ring.slice(0, -1).map(function (p) {
          var t = w2t(p);
          return new THREE.Vector3(t[0], t[1], t[2]);
        });
        edgePts.push(edgePts[0].clone());
        var eGeo = new THREE.BufferGeometry().setFromPoints(edgePts);
        var eCol = bdata.role === 'reference' ? 0x1b5e20 : 0x4a0000;
        scene.add(new THREE.Line(eGeo,
          new THREE.LineBasicMaterial({ color: eCol, transparent: true, opacity: 0.55 })));
      });
    }
  });

  // Dashed connector line from reference to each neighbour
  if (bdata.role === 'neighbour') {
    var ref = BUILDINGS[REF_ID];
    var a = w2t([bdata.cx, bdata.cy, bdata.gz]);
    var b = w2t([ref.cx,   ref.cy,   ref.gz]);
    var lGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(b[0], 0.5, b[2]),
      new THREE.Vector3(a[0], 0.5, a[2])
    ]);
    var lMat = new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 4, gapSize: 3,
                                              transparent: true, opacity: 0.45 });
    var l = new THREE.Line(lGeo, lMat);
    l.computeLineDistances();
    scene.add(l);
  }
});

// ── Raycasting / tooltip ──────────────────────────────────────────────────────
var raycaster = new THREE.Raycaster();
var mouse = new THREE.Vector2();
var tooltip = document.getElementById('tooltip');
var lastId = null;

window.addEventListener('mousemove', function (e) {
  mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  var hits = raycaster.intersectObjects(hoverTargets, false);

  if (hits.length > 0) {
    var ud = hits[0].object.userData;
    if (ud.id !== lastId) {
      lastId = ud.id;
      var ref = BUILDINGS[REF_ID];
      var dist = ud.id === REF_ID
        ? '&#8212; (reference)'
        : Math.round(Math.hypot(ud.bdata.cx - ref.cx, ud.bdata.cy - ref.cy)) + ' m from reference';
      tooltip.innerHTML = '<strong>' + ud.id + '</strong><br>' + ud.bdata.desc + '<br>Distance: ' + dist;
    }
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 16) + 'px';
    tooltip.style.top  = (e.clientY - 10) + 'px';
  } else {
    tooltip.style.display = 'none';
    lastId = null;
  }
});

canvas.addEventListener('mouseleave', function () {
  tooltip.style.display = 'none';
  lastId = null;
});

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Render loop ───────────────────────────────────────────────────────────────
(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
