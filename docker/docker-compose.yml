services:
  neo4j:
    build:
      context: .
      dockerfile: Dockerfile.neo4j
    container_name: neo4j
    ports:
      - "7474:7474"   # HTTP  - Browser UI & REST API
      - "7473:7473"   # HTTPS
      - "7687:7687"   # Bolt  - Driver connections
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/neo4jneo4j
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  llm-query:
    build:
      context: ..
      dockerfile: docker/Dockerfile.query
    container_name: llm-query
    environment:
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jneo4j
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_MODEL=deepseek-r1:14b
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started
    stdin_open: true
    tty: true
    profiles:
      - query

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_data: