# 3DCityKG run config for the mapping-time benchmark.
# case = 0  -> MAP ONLY (no export), so the measured time is pure mapping,
# consistent with pykci (ingest only) and 3DCityDB (import only).
case = 0

# DATABASE CONFIGURATIONS
db.path = "output/neo4jDB"
db.name = "neo4j"
db.batch.size = 1000

# MAPPER CONFIGURATIONS
mapper.dataset.paths = [
  "input/citygml/hamburg_citygml2_lod2_2025.gml"
]
mapper.exclude.vertex.classes = []
mapper.exclude.edge.types = [
  "this$0",
  "associableClass", "cityGMLClass", "gMLClass", "module", "parent"
]
mapper.concurrent.timeout = 360000
mapper.toplevel.batch.size = 10

# NEO4J CONFIGURATIONS
neo4j.config.file = "config/neo4j.conf"
neo4j.plugin.path = "plugins"
# Store RTree in database (true) so the spatial index is part of the graph on disk
neo4j.rtree.store = true
neo4j.rtree.img.path = "output/img"

# CITYGML CONFIGURATIONS
citygml.version = "v2_0"
cityjson = false

# Export settings (unused for case = 0)
citygml.export.partition = 0
citygml.export.bbox = ""
citygml.export.path = "output/citygml/export_v2.gml"
